name: R12 dynamic evidence acquisition

on:
  push:
    branches:
      - main
    paths:
      - "src/dynamic_evidence_acquisition.py"
      - "src/dynamic_evidence_benchmark.py"
      - "tests/test_dynamic_evidence_acquisition.py"
      - ".github/workflows/r12-dynamic-evidence-acquisition.yml"
      - "docs/research/2026-09-25-r12-dynamic-evidence-acquisition.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: "36004833542"
  SUBJECT_REPOSITORY: BestNathan/nession
  SUBJECT_SHA: 7ac9b6e0c2bb43c52f83e7dd706c0c0dc0d7a1df
  TYPESAFE_MODEL: ${{ vars.TYPESAFE_MODEL || 'jev-latest' }}
  TYPESAFE_API_URL: ${{ vars.TYPESAFE_API_URL || 'https://api.typesafe.ai/v1/systemone' }}

jobs:
  dynamic:
    name: Dynamic / ${{ matrix.case.id }} / r${{ matrix.repeat }} / ${{ matrix.estimator }}
    runs-on: ubuntu-24.04
    environment: typesafe
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repeat: [1, 2]
        estimator:
          - sequential_exponential
          - multi_scale_gaussian
        case:
          - id: reconnect_lifecycle
            path: crates/nession-agent/src/connection/server_client.rs
            goal: >-
              Help me improve the agent-to-server reconnect lifecycle:
              exponential backoff, registration after reconnect,
              connected/sync-needed state transitions, and behavior of queued
              outbound messages while disconnected.
          - id: protocol_catalog_consistency
            path: crates/nession-protocol-codegen/src/catalog.rs
            goal: >-
              Help me make protocol contract generation safer: locate the
              catalog code that defines unit identity and wire/request/response
              mappings and the checks that prevent missing, duplicate, or
              non-self-contained generated contracts.
          - id: full_stack_command_lifecycle
            path: crates/nession-server/tests/integration/full_stack.rs
            goal: >-
              I am debugging the server's agent command lifecycle. Locate the
              integration-test code that exercises agent registration, command
              request/response routing, disconnect or reconnect behavior, and
              cleanup of pending work.
    env:
      CASE_ID: ${{ matrix.case.id }}
      FILE_PATH: ${{ matrix.case.path }}
      GOAL: ${{ matrix.case.goal }}
      REPEAT: ${{ matrix.repeat }}
      ESTIMATOR: ${{ matrix.estimator }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frozen subject
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUBJECT_REPOSITORY }}
          ref: ${{ env.SUBJECT_SHA }}
          path: subject
          fetch-depth: 1
          persist-credentials: false

      - name: Download canonical R08 reference
        uses: actions/download-artifact@v4
        with:
          name: r08-holdout-reference-${{ matrix.case.id }}
          path: artifacts/reference
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download canonical Phase0 trajectory
        uses: actions/download-artifact@v4
        with:
          name: r08-holdout-result-${{ matrix.case.id }}-repeat-${{ matrix.repeat }}
          path: artifacts/phase0
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run dynamic evidence acquisition
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY || secrets.TYPESAFE_KEY || secrets.SYSTEM_ONE_API_KEY || secrets.TYPE_SAFE_API_KEY || vars.TYPESAFE_API_KEY || vars.TYPESAFE_KEY || vars.SYSTEM_ONE_API_KEY || vars.TYPE_SAFE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$TYPESAFE_API_KEY"
          mkdir -p artifacts/out
          python3 src/dynamic_evidence_acquisition.py             --source "subject/$FILE_PATH"             --goal "$GOAL"             --phase0-run "artifacts/phase0/$ESTIMATOR/run.json"             --tile-lines 32             --minimum-lift 1.1             --max-rounds 32             --trace-file artifacts/out/trace.jsonl             --output artifacts/out/run.json

      - name: Evaluate evidence and stopping quality
        run: |
          python3 src/dynamic_evidence_benchmark.py             --reference artifacts/reference/reference.json             --run artifacts/out/run.json             --output-json artifacts/out/benchmark.json             --output-markdown artifacts/out/benchmark.md
          cat artifacts/out/benchmark.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dynamic evidence result
        uses: actions/upload-artifact@v4
        with:
          name: r12-dynamic-${{ matrix.case.id }}-r${{ matrix.repeat }}-${{ matrix.estimator }}
          path: artifacts/out/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Aggregate R12 dynamic evidence
    needs: dynamic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: r12-dynamic-*
          path: artifacts/all

      - name: Aggregate R12
        run: |
          python3 - <<'PY'
          import json
          import statistics
          from collections import defaultdict, Counter
          from pathlib import Path

          rows = []
          for benchmark_path in sorted(
              Path("artifacts/all").glob("*/benchmark.json")
          ):
              root = benchmark_path.parent
              benchmark = json.loads(benchmark_path.read_text())
              run = json.loads((root / "run.json").read_text())
              rows.append((run, benchmark))

          if not rows:
              raise SystemExit("no R12 results")

          grouped = defaultdict(list)
          for run, benchmark in rows:
              estimator = run["phase0_source"]["posterior_estimator"]
              grouped[estimator].append((run, benchmark))

          aggregate = {
              "schema_version": 1,
              "kind": "r12-dynamic-evidence-aggregate",
              "source_phase0_run": 36004833542,
              "runs": len(rows),
              "estimators": {},
              "fixed_six_baseline": json.loads(
                  Path(
                      "fixtures/research/"
                      "r10-final-evidence-quality-aggregate.json"
                  ).read_text()
              )["estimators"],
          }

          for estimator, items in sorted(grouped.items()):
              def mean_metric(name):
                  return statistics.fmean(
                      benchmark["metrics"][name]
                      for _, benchmark in items
                  )

              terminations = Counter(
                  run["termination"]
                  for run, _ in items
              )
              aggregate["estimators"][estimator] = {
                  "mean_selected_tiles": statistics.fmean(
                      run["selected_count"]
                      for run, _ in items
                  ),
                  "mean_selected_lines": statistics.fmean(
                      run["selected_lines"]
                      for run, _ in items
                  ),
                  "mean_source_fraction": mean_metric(
                      "source_fraction"
                  ),
                  "mean_reference_relevance": mean_metric(
                      "mean_reference_relevance"
                  ),
                  "high_line_precision": mean_metric(
                      "high_line_precision"
                  ),
                  "high_line_recall": mean_metric(
                      "high_line_recall"
                  ),
                  "weighted_relevance_recall": mean_metric(
                      "weighted_relevance_recall"
                  ),
                  "evidence_efficiency": statistics.fmean(
                      (
                          benchmark["metrics"][
                              "weighted_relevance_recall"
                          ]
                          / benchmark["metrics"]["source_fraction"]
                      )
                      if benchmark["metrics"]["source_fraction"]
                      else 0.0
                      for _, benchmark in items
                  ),
                  "oracle_ratio_precision": statistics.fmean(
                      benchmark["oracle_ratio"][
                          "mean_reference_relevance"
                      ]
                      for _, benchmark in items
                  ),
                  "oracle_ratio_high_recall": statistics.fmean(
                      benchmark["oracle_ratio"]["high_line_recall"]
                      for _, benchmark in items
                  ),
                  "premature_stop_rate": statistics.fmean(
                      1.0 if benchmark["stop"]["premature_stop"] else 0.0
                      for _, benchmark in items
                  ),
                  "mean_best_remaining_relevance": statistics.fmean(
                      (
                          benchmark["stop"]["best_remaining"][
                              "mean_relevance"
                          ]
                          if benchmark["stop"]["best_remaining"]
                          else 0.0
                      )
                      for _, benchmark in items
                  ),
                  "safety_cap_rate": statistics.fmean(
                      1.0 if run["termination"] == "safety_cap" else 0.0
                      for run, _ in items
                  ),
                  "mean_model_calls": statistics.fmean(
                      run["usage"]["model_calls"]
                      for run, _ in items
                  ),
                  "mean_input_tokens": statistics.fmean(
                      run["usage"]["input_tokens"]
                      for run, _ in items
                  ),
                  "terminations": dict(terminations),
              }

          Path("aggregate.json").write_text(
              json.dumps(
                  aggregate,
                  indent=2,
                  ensure_ascii=False,
              ) + "\n"
          )
          print(json.dumps(aggregate, indent=2))
          PY
          cat aggregate.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: r12-dynamic-evidence-aggregate-${{ github.run_id }}
          path: aggregate.json
          retention-days: 90
