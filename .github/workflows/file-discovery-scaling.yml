name: File Discovery — Algorithm Scaling Experiment

on:
  push:
    branches: [main]
    paths: [fixtures/file-discovery/scaling-experiment.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-discovery-scaling-paid
  cancel-in-progress: false

env:
  TYPESAFE_MODEL: ${{ vars.TYPESAFE_MODEL || 'jev-latest' }}
  TYPESAFE_API_URL: ${{ vars.TYPESAFE_API_URL || 'https://api.typesafe.ai/v1/systemone' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Authorize and test before paid requests
        run: |
          test "$GITHUB_ACTOR" = BestNathan
          python3 -m unittest discover -s tests -v

  experiment:
    needs: validate
    runs-on: ubuntu-24.04
    environment: typesafe
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - slug: nession
            repository: BestNathan/nession
            revision: 7ac9b6e0c2bb43c52f83e7dd706c0c0dc0d7a1df
          - slug: codex
            repository: openai/codex
            revision: d7b07d45517a793acfba4cbf8de697d723cceb46
          - slug: openclaw
            repository: openclaw/openclaw
            revision: 932abb0a841b522ebaa5b81921119a61b6a80b21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: subject
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run frozen algorithm and concurrency arms
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY || secrets.TYPESAFE_KEY || secrets.SYSTEM_ONE_API_KEY || secrets.TYPE_SAFE_API_KEY || vars.TYPESAFE_API_KEY || vars.TYPESAFE_KEY || vars.SYSTEM_ONE_API_KEY || vars.TYPE_SAFE_API_KEY }}
        run: |
          test -n "$TYPESAFE_API_KEY"
          test "$(git -C subject rev-parse HEAD)" = "${{ matrix.revision }}"
          python3 src/file_discovery_scaling_benchmark.py \
            --root subject --repository '${{ matrix.repository }}' \
            --output-dir artifacts/${{ matrix.slug }} \
            --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - name: Attach repository report
        if: always()
        run: |
          if [ -f artifacts/${{ matrix.slug }}/report.md ]; then
            cat artifacts/${{ matrix.slug }}/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fd-scaling-${{ matrix.slug }}
          path: artifacts/${{ matrix.slug }}/
          retention-days: 30
          if-no-files-found: warn

  report:
    if: always()
    needs: [validate, experiment]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fd-scaling-*
          path: artifacts/raw
      - name: Generate report including failed or missing jobs
        run: |
          python3 src/file_discovery_scaling_benchmark.py \
            --aggregate artifacts/raw --output-dir artifacts/report \
            --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          cat artifacts/report/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fd-scaling-report-${{ github.run_id }}
          path: artifacts/report/
          retention-days: 90
