name: File Discovery — Large Repo System One Profiles

on:
  push:
    branches:
      - main
    paths:
      - "src/file_discovery_v1.py"
      - "src/file_discovery_profiles.py"
      - "src/model_pricing.py"
      - "fixtures/file-discovery/system1-vs-system2-cases.json"
      - "fixtures/research/file-discovery-system2-frozen-metrics.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  CASES: fixtures/file-discovery/system1-vs-system2-cases.json
  SYSTEM2_REFERENCE: fixtures/research/file-discovery-system2-frozen-metrics.json
  TYPESAFE_MODEL: ${{ vars.TYPESAFE_MODEL || 'jev-latest' }}
  TYPESAFE_API_URL: ${{ vars.TYPESAFE_API_URL || 'https://api.typesafe.ai/v1/systemone' }}

jobs:
  authorize:
    name: Authorize benchmark actor
    runs-on: ubuntu-24.04
    steps:
      - name: Require BestNathan
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "BestNathan" || {
            echo "Paid research jobs may only run for github.actor=BestNathan" >&2
            exit 1
          }

  system-one:
    name: S1 / ${{ matrix.case.id }} / ${{ matrix.profile }}
    needs: authorize
    runs-on: ubuntu-24.04
    environment: typesafe
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        profile:
          - baseline_v1
          - instruction_v2
          - enriched_state_v3
          - compact_state_v4
        case:
          - id: nession_backend_reconnect_lifecycle
            repository: BestNathan/nession
            revision: 7ac9b6e0c2bb43c52f83e7dd706c0c0dc0d7a1df
          - id: nession_filesystem_symlink_delete_safety
            repository: BestNathan/nession
            revision: 7ac9b6e0c2bb43c52f83e7dd706c0c0dc0d7a1df
          - id: nession_frontend_request_correlation
            repository: BestNathan/nession
            revision: 7ac9b6e0c2bb43c52f83e7dd706c0c0dc0d7a1df
          - id: openclaw_gateway_ws_dispatch
            repository: openclaw/openclaw
            revision: 932abb0a841b522ebaa5b81921119a61b6a80b21
          - id: openclaw_skill_source_precedence
            repository: openclaw/openclaw
            revision: 932abb0a841b522ebaa5b81921119a61b6a80b21
          - id: openclaw_memory_hybrid_search
            repository: openclaw/openclaw
            revision: 932abb0a841b522ebaa5b81921119a61b6a80b21
          - id: codex_approval_routing
            repository: openai/codex
            revision: d7b07d45517a793acfba4cbf8de697d723cceb46
          - id: codex_mcp_tool_approval
            repository: openai/codex
            revision: d7b07d45517a793acfba4cbf8de697d723cceb46
          - id: codex_thread_resume_persistence
            repository: openai/codex
            revision: d7b07d45517a793acfba4cbf8de697d723cceb46
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frozen subject
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.case.repository }}
          ref: ${{ matrix.case.revision }}
          path: subject
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run System One profile
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY || secrets.TYPESAFE_KEY || secrets.SYSTEM_ONE_API_KEY || secrets.TYPE_SAFE_API_KEY || vars.TYPESAFE_API_KEY || vars.TYPESAFE_KEY || vars.SYSTEM_ONE_API_KEY || vars.TYPE_SAFE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$TYPESAFE_API_KEY"
          OUT="artifacts/system-one/${{ matrix.case.id }}/${{ matrix.profile }}"
          mkdir -p "$OUT"
          QUERY="$(python3 - "$CASES" "${{ matrix.case.id }}" <<'PY'
          import json,sys
          fixture=json.load(open(sys.argv[1]))
          case=next(x for x in fixture["cases"] if x["id"]==sys.argv[2])
          print(case["goal"])
          PY
          )"
          python3 src/file_discovery_v1.py             subject "$QUERY"             --profile "${{ matrix.profile }}"             --file-threshold 0.65             --relative-fallback-fraction 0.01             --transport-batch-size 64             --trace-file "$OUT/trace.jsonl"             --output "$OUT/run.json"
          python3 - "$OUT/run.json" <<'PY'
          import json, os, sys
          path=sys.argv[1]
          obj=json.load(open(path))
          obj["benchmark_case_id"]="${{ matrix.case.id }}"
          obj["subject_repository"]="${{ matrix.case.repository }}"
          obj["subject_revision"]="${{ matrix.case.revision }}"
          open(path,"w").write(json.dumps(obj,indent=2)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: fd-s1-${{ matrix.case.id }}-${{ matrix.profile }}
          path: artifacts/system-one/${{ matrix.case.id }}/${{ matrix.profile }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Aggregate large-repo profile benchmark
    needs: system-one
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: fd-s1-*
          path: artifacts/system-one

      - name: Aggregate System One profiles against frozen System2
        run: |
          python3 - <<'PY'
          import json, statistics
          from collections import defaultdict
          from pathlib import Path

          cases=json.load(open("fixtures/file-discovery/system1-vs-system2-cases.json"))
          case_by_id={x["id"]:x for x in cases["cases"]}
          s2=json.load(open("fixtures/research/file-discovery-system2-frozen-metrics.json"))["results"]

          rows=[]
          for path in sorted(Path("artifacts/system-one").glob("*/run.json")):
              run=json.loads(path.read_text())
              case_id=run["benchmark_case_id"]
              case=case_by_id[case_id]
              primary=set(case["primary_files"])
              selected={x["path"] for x in run["relevant_files"]}
              scores=run["file_scores"]
              ordered=sorted(scores.items(),key=lambda kv:(-kv[1],kv[0]))
              ranks={p:i+1 for i,(p,_) in enumerate(ordered)}
              rows.append({
                  "case_id":case_id,
                  "repository":case["repository"],
                  "profile":run["profile"],
                  "enumerated_files":run["enumerated_file_count"],
                  "primary_recall":len(primary & selected)/len(primary),
                  "primary_scores":{p:scores.get(p) for p in sorted(primary)},
                  "primary_ranks":{p:ranks.get(p) for p in sorted(primary)},
                  "selected_file_count":len(selected),
                  "model_calls":run["usage"]["model_calls"],
                  "input_tokens":run["usage"]["input_tokens"],
                  "output_tokens":run["usage"]["output_tokens"],
                  "model_wall_time_ms":run["usage"]["model_wall_time_ms"],
                  "estimated_cost_usd":run["usage"]["pricing"]["estimated_cost_usd"],
              })

          def avg(items,key):
              vals=[float(x[key]) for x in items if x.get(key) is not None]
              return statistics.fmean(vals) if vals else None

          def summary(items):
              return {
                  "cases":len(items),
                  "mean_primary_recall":avg(items,"primary_recall"),
                  "mean_selected_files":avg(items,"selected_file_count"),
                  "mean_model_calls":avg(items,"model_calls"),
                  "mean_input_tokens":avg(items,"input_tokens"),
                  "mean_output_tokens":avg(items,"output_tokens"),
                  "mean_wall_time_ms":avg(items,"model_wall_time_ms"),
                  "mean_cost_usd":avg(items,"estimated_cost_usd"),
              }

          by_profile=defaultdict(list)
          by_repo_profile=defaultdict(list)
          for row in rows:
              by_profile[row["profile"]].append(row)
              by_repo_profile[(row["repository"],row["profile"])].append(row)

          s2_rows=list(s2.values())
          payload={
              "schema_version":3,
              "kind":"file-discovery-large-repo-system-one-profile-benchmark",
              "system2_reference_source_run":36109538329,
              "system_one_profiles":{
                  profile:summary(items)
                  for profile,items in sorted(by_profile.items())
              },
              "system_one_by_repository":{
                  f"{repo}::{profile}":summary(items)
                  for (repo,profile),items in sorted(by_repo_profile.items())
              },
              "system_two_frozen":{
                  "cases":len(s2_rows),
                  "mean_primary_recall":statistics.fmean(x["primary_recall"] for x in s2_rows),
                  "mean_selected_files":statistics.fmean(x["selected_file_count"] for x in s2_rows),
                  "mean_tool_calls":statistics.fmean(x["tool_calls"] for x in s2_rows),
                  "mean_wall_time_ms":statistics.fmean(x["duration_ms"] for x in s2_rows),
                  "mean_provider_cost_usd":statistics.fmean(x["provider_cost_usd"] for x in s2_rows),
              },
              "rows":rows,
          }
          Path("aggregate.json").write_text(json.dumps(payload,indent=2)+"\n")
          print(json.dumps(payload,indent=2))
          PY
          cat aggregate.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: fd-large-repo-profiles-${{ github.run_id }}
          path: aggregate.json
          retention-days: 90
